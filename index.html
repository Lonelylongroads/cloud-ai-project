<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud AI Analyzer</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 40px;
        background: #eef2f3;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        max-width: 550px;
        margin: 0 auto;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #333;
        margin-top: 0;
      }
      textarea {
        width: 100%;
        height: 100px;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
        margin-top: 10px;
        width: 100%;
      }
      button:hover {
        background: #0056b3;
      }
      pre {
        background: #272822;
        color: #f8f8f2;
        padding: 15px;
        border-radius: 5px;
        overflow-x: auto;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>☁️ Cloud AI Sentiment Analyzer</h2>
      <p>Runs on Kubernetes Cluster with Hugging Face AI Integration</p>
      <textarea
        id="inputText"
        placeholder="Type something... e.g. 'Cloud computing with Kubernetes makes deployment so seamless!'"
      ></textarea>
      <button onclick="analyzeText()">Analyze Sentiment</button>

      <h3>Result:</h3>
      <pre id="output">Results will appear here after clicking analyze...</pre>
    </div>

    <script>
      async function analyzeText() {
        const text = document.getElementById("inputText").value;
        const outputElement = document.getElementById("output");
        outputElement.innerText = "Analyzing via Cloud API...";

        try {
          const response = await fetch("http://localhost:5000/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text }),
          });
          const data = await response.json();
          outputElement.innerText = JSON.stringify(data, null, 2);
        } catch (error) {
          outputElement.innerText =
            "Error connecting to cloud service: " + error.message;
        }
      }
    </script>
  </body>
</html>
